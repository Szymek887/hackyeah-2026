# Production stack: PostgreSQL + PostGIS, Spring Boot API and the Expo web app behind nginx.
# nginx serves the web app and proxies /api to the backend, so one public URL covers both:
# build the mobile app with EXPO_PUBLIC_API_URL=https://<your-domain>.
#
#   cp .env.example .env   # set POSTGRES_PASSWORD and OPENROUTER_API_KEY
#   docker compose up -d --build

services:
  db:
    image: imresamu/postgis:17-3.5-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackyeah}
      POSTGRES_USER: ${POSTGRES_USER:-hackyeah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend/hackyeah-2026-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-hackyeah}
      DB_USER: ${POSTGRES_USER:-hackyeah}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AI_ENABLED: ${AI_ENABLED:-true}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODELS: ${OPENROUTER_MODELS:-google/gemma-4-31b-it:free,qwen/qwen3.8-27b:free}
      # Only needed for browsers on a different origin; the bundled web app is same-origin.
      CORS_ALLOWED_ORIGIN_PATTERNS: ${CORS_ALLOWED_ORIGIN_PATTERNS:-http://localhost:*}
    # Not public: reachable through nginx at /api. Bound to localhost for debugging only.
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080'"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 10

  web:
    build:
      context: ./frontend/hackyeah-2026-app
      args:
        EXPO_PUBLIC_API_URL: ${WEB_API_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  db-data:
