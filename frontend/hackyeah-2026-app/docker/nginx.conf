server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 5m;

    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # AI formatting + classification can take a while on free models.
        proxy_read_timeout 90s;
    }

    # Hashed bundles never change.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Dynamic Expo Router routes are exported as e.g. /request/[id].html.
    location ~ ^/(request|task|rate)/[^/]+/?$ {
        try_files $uri /$1/[id].html =404;
    }

    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }
}
