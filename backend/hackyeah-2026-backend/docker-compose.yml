services:
  db:
    image: imresamu/postgis:17-3.5-alpine
    container_name: hackyeah-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hackyeah}
      POSTGRES_USER: ${POSTGRES_USER:-hackyeah}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hackyeah}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
