spring.application.name=hackyeah-2026-backend

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:hackyeah}
spring.datasource.username=${DB_USER:hackyeah}
spring.datasource.password=${DB_PASSWORD:hackyeah}
spring.jpa.hibernate.ddl-auto=update

# Local secrets (OpenRouter API key), never committed: copy secrets.properties.example to secrets.properties.
spring.config.import=optional:file:./secrets.properties

app.ai.enabled=${AI_ENABLED:true}
app.ai.base-url=${OPENROUTER_URL:https://openrouter.ai/api/v1}
app.ai.api-key=${OPENROUTER_API_KEY:}
# Free models in order of preference; OpenRouter moves to the next one when a model is rate-limited.
# Gemma 4 31B writes the most natural Polish; Qwen 3.8 27B is a close second.
app.ai.models=${OPENROUTER_MODELS:google/gemma-4-31b-it:free,qwen/qwen3.8-27b:free}
app.ai.timeout=20s

# Browser origins allowed to call /api/** (comma-separated Spring origin patterns).
# Defaults cover Expo web / dashboard on localhost and on a home or hotspot LAN.
app.cors.allowed-origin-patterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*,http://127.0.0.1:*,http://192.168.*:*,http://10.*:*,http://172.*:*}

# City dashboard heatmap: hexagons with fewer requests are hidden (k-anonymity).
app.analytics.min-cell-count=${ANALYTICS_MIN_CELL_COUNT:3}
